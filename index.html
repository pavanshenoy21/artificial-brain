<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artificial Brain</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/app.css" />
    <script>
      // apply the saved theme before first paint
      try { var t = JSON.parse(localStorage.getItem("brain.prefs") || "{}").theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <nav class="ribbon" id="ribbon" aria-label="Ribbon"></nav>

      <aside class="sidebar sidebar-left" id="left" aria-label="Left sidebar">
        <div class="side-tabs" id="left-tabs" role="tablist"></div>
        <div class="side-body" id="left-body"></div>
      </aside>
      <div class="resizer" data-side="left" title="Drag to resize"></div>

      <main class="workspace">
        <div class="tabbar" id="tabbar"></div>
        <div class="panes" id="panes"></div>
      </main>

      <div class="resizer" data-side="right" title="Drag to resize"></div>
      <aside class="sidebar sidebar-right" id="right" aria-label="Right sidebar">
        <div class="side-tabs" id="right-tabs" role="tablist"></div>
        <div class="side-body" id="right-body"></div>
      </aside>
    </div>
    <footer class="statusbar" id="status"></footer>

    <div class="modal-backdrop" id="palette" hidden></div>
    <div id="fx-layer" class="fx-layer"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
