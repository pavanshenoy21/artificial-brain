<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick capture</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/capture.css" />
    <script>
      try { var t = JSON.parse(localStorage.getItem("brain.prefs") || "{}").theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <form class="capture" id="capture" autocomplete="off">
      <div class="capture-row">
        <span class="capture-icon" id="icon"></span>
        <input id="text" placeholder="Paste a URL, or type a quick note" spellcheck="false" autofocus />
      </div>
      <div class="capture-foot">
        <span id="status" role="status"></span>
        <span class="keys"><kbd>Enter</kbd> save <kbd>Esc</kbd> close</span>
      </div>
    </form>
    <script type="module" src="/src/capture.js"></script>
  </body>
</html>
